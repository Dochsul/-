name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks (HTML, links, sitemap, CSP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run scripts/check.mjs
        run: node scripts/check.mjs
