name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests, build, static checks, Tilda package sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit and integration tests (server, ledger, site, Tilda package)
        run: npm test
      - name: Build the development site
        run: npm run build
      - name: Static checks on dist/ and source secrets
        run: npm run check
      - name: Tilda package is in sync with the sources
        run: |
          npm run tilda
          git diff --exit-code -- tilda/ || (echo "tilda/ is out of date: run npm run tilda and commit" && exit 1)

  e2e:
    name: Browser e2e of the Tilda shop block (Stripe stub, no real payments)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (test-only, not a runtime dependency)
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Tilda shop e2e
        run: npm run e2e:tilda

  docker:
    name: Docker image builds, starts healthy, runs safely, backs up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f deploy/Dockerfile -t aina-api .
      - name: Compose file is valid
        run: |
          cp .env.example .env
          docker compose -f deploy/docker-compose.yml --env-file .env config -q
          rm .env
      - name: Container starts healthy, as non-root, with a read-only filesystem
        run: |
          docker volume create aina_data
          docker run -d --name api --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -v aina_data:/app/data -e NODE_ENV=development -e PORT=8080 -e PRIVATE_DIR=/app/private/products \
            -e BACKUP_PASSPHRASE=ci-only-passphrase-not-a-secret-123 -e BACKUP_DIR=/app/data/backups -e DB_FILE=/app/data/app.db \
            -p 8080:8080 aina-api
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/api/health && break; sleep 1; done
          curl -fsS http://localhost:8080/api/health | grep '"ok":true'
          test "$(docker exec api id -u)" != "0"
          # the static site is not part of the API image
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = "404"
      - name: Production guard refuses an unsafe configuration inside the image
        run: |
          set +e
          docker run --rm -e NODE_ENV=production aina-api node server/index.mjs
          code=$?
          test "$code" = "2"
      - name: Encrypted backup and verification inside the container
        run: |
          docker exec api node scripts/backup.mjs
          docker exec api node scripts/restore.mjs latest --verify-only
      - name: Container logs
        if: always()
        run: docker logs api

  # Deliberately NO deploy job. Publication is a manual decision by the owner.
