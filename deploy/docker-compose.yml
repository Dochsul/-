# One small VPS: Caddy (automatic HTTPS) -> API (SQLite) + daily encrypted backup.
# Run from the repository root:  docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
name: aina
services:
  api:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: ../.env
    environment: { NODE_ENV: production, PORT: "8080", DB_FILE: /app/data/app.db, DATA_DIR: /app/data, PRIVATE_DIR: /app/private/products, TRUST_PROXY: "true" }
    volumes:
      - aina_data:/app/data                      # database, outbox (state; backed up)
      - ../private/products:/app/private/products:ro   # PDF guides, read-only for the API
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 200
    mem_limit: 512m
    expose: ["8080"]
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: { api: { condition: service_healthy } }
    environment: { API_DOMAIN: "${API_DOMAIN:?set API_DOMAIN in .env}" }
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                          # certificates
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

  backup:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: ../.env
    environment: { DB_FILE: /app/data/app.db, BACKUP_DIR: /app/data/backups }
    volumes: [ "aina_data:/app/data" ]
    command: ["sh", "-c", "while true; do node scripts/backup.mjs || true; sleep 86400; done"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m

volumes:
  aina_data:
  caddy_data:
  caddy_config:
